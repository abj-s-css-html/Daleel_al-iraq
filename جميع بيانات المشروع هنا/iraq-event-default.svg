<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M40 0 L80 40 L40 80 L0 40 Z" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="#0B0B0B"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- red and mint shapes -->
  <circle cx="1350" cy="130" r="330" fill="#CE1126"/>
  <circle cx="1350" cy="130" r="230" fill="none" stroke="#0B0B0B" stroke-width="14"/>
  <circle cx="230" cy="800" r="300" fill="#3EEBB0"/>
  <circle cx="230" cy="800" r="200" fill="none" stroke="#0B0B0B" stroke-width="14"/>

  <!-- top and bottom stripes -->
  <rect x="0" y="0" width="1600" height="26" fill="#CE1126"/>
  <rect x="0" y="874" width="1600" height="26" fill="#3EEBB0"/>

  <!-- center panel -->
  <rect x="300" y="290" width="1000" height="320" rx="28" fill="#0B0B0B" stroke="#ffffff" stroke-width="6"/>
  <rect x="324" y="314" width="952" height="272" rx="16" fill="none" stroke="#3EEBB0" stroke-width="3" stroke-dasharray="4 12" stroke-linecap="round"/>

  <!-- text -->
  <text x="725" y="470" text-anchor="end" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-weight="800" font-size="125" letter-spacing="4" fill="#FFFFFF">IRAQ</text>
  <text x="765" y="470" text-anchor="start" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-weight="800" font-size="125" letter-spacing="4" fill="#3EEBB0">EVENT</text>

  <!-- tricolor bar under text -->
  <rect x="500" y="530" width="200" height="12" rx="6" fill="#CE1126"/>
  <rect x="700" y="530" width="200" height="12" rx="6" fill="#FFFFFF"/>
  <rect x="900" y="530" width="200" height="12" rx="6" fill="#3EEBB0"/>
</svg>
